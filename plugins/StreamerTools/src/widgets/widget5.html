<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compact Block Media Widget</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

:root {
    --primary:#7c5cff;
    --secondary:#4ea4ff;
    --bg:#111214;
    --panel:#1c1f24;
    --text:#fff;
    --muted:rgba(255,255,255,.55);
}


* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Roboto,Arial,sans-serif;
}


html,body {
    background:transparent;
    overflow:hidden;
}


.widget {

    width:360px;

    background:var(--bg);

    color:white;

    border-radius:8px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.1);

}



/* CURRENT */

.main {

    display:flex;

    height:76px;

}


.cover {

    width:76px;

    height:76px;

    object-fit:cover;

    flex-shrink:0;

}


.info {

    flex:1;

    min-width:0;

    padding:10px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}


.tag {

    font-size:8px;

    letter-spacing:.14em;

    font-weight:800;

    color:var(--primary);

    text-transform:uppercase;

}


.title {

    font-size:16px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.artist {

    font-size:12px;

    color:white;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.album {

    font-size:10px;

    color:var(--muted);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}



/* PROGRESS */

.progress {

    height:4px;

    background:#292c32;

}


.bar {

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    transition:width .15s linear;

}



/* NEXT */

.next {

    height:48px;

    background:var(--panel);

    display:flex;

    align-items:center;

    gap:8px;

    padding:6px;

}


.next-cover {

    width:36px;

    height:36px;

    object-fit:cover;

}


.next-info {

    min-width:0;

}


.next-label {

    font-size:8px;

    color:var(--secondary);

    font-weight:800;

    text-transform:uppercase;

}


.next-title {

    font-size:12px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.next-artist {

    font-size:10px;

    color:var(--muted);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

</style>

</head>


<body>


<div class="widget">


    <div class="main">


        <img
            id="cover"
            class="cover"
            src="https://placehold.co/150"
        >


        <div class="info">

            <div class="tag">
                NOW PLAYING
            </div>


            <div
                class="title"
                id="title">
                Nothing Playing
            </div>


            <div
                class="artist"
                id="artist">
            </div>


            <div
                class="album"
                id="album">
            </div>

        </div>


    </div>



    <div class="progress">

        <div
            class="bar"
            id="bar">
        </div>

    </div>



    <div class="next">


        <img
            id="nextCover"
            class="next-cover"
            src="https://placehold.co/80"
        >


        <div class="next-info">

            <div class="next-label">
                UP NEXT
            </div>


            <div
                class="next-title"
                id="nextTitle">
                No upcoming track
            </div>


            <div
                class="next-artist"
                id="nextArtist">
            </div>

        </div>


    </div>


</div>



<script>

const socket = io();


let media = {

    title:"",
    artist:"",
    album:"",
    coverURL:"",

    playing:false,

    progress:0,
    duration:0,

    primaryColor:"#7c5cff",
    secondaryColor:"#4ea4ff",

    nextMediaItem:null

};



const cover =
document.getElementById("cover");

const title =
document.getElementById("title");

const artist =
document.getElementById("artist");

const album =
document.getElementById("album");

const bar =
document.getElementById("bar");


const nextCover =
document.getElementById("nextCover");

const nextTitle =
document.getElementById("nextTitle");

const nextArtist =
document.getElementById("nextArtist");



function update(){


    title.textContent =
        media.title || "Nothing Playing";


    artist.textContent =
        media.artist || "";


    album.textContent =
        media.album || "";


    if(media.coverURL){

        cover.src =
            media.coverURL;

    }



    document.documentElement.style.setProperty(
        "--primary",
        media.primaryColor || "#7c5cff"
    );


    document.documentElement.style.setProperty(
        "--secondary",
        media.secondaryColor || "#4ea4ff"
    );



    const percent =
        media.duration
        ?
        media.progress / media.duration * 100
        :
        0;


    bar.style.width =
        percent + "%";



    if(media.nextMediaItem){

        nextTitle.textContent =
            media.nextMediaItem.title || "";


        nextArtist.textContent =
            media.nextMediaItem.artist || "";


        if(media.nextMediaItem.coverURL){

            nextCover.src =
                media.nextMediaItem.coverURL;

        }

    }

}



socket.on(
    "streamer-tools.playbackUpdate",
    data => {

        media = {
            ...media,
            ...data
        };

        update();

    }
);



let last = performance.now();


function animate(now){

    const delta =
        (now-last)/1000;

    last=now;


    if(media.playing){

        media.progress =
            Math.min(
                media.progress + delta,
                media.duration
            );

        update();

    }


    requestAnimationFrame(animate);

}


requestAnimationFrame(animate);

</script>


</body>
</html>
